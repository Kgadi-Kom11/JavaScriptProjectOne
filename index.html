<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock, Paper, Scissors Game</title>
  <link rel="stylesheet" href="./RockPaperScissors.css">
 
</head>
<body>
  <h2>Rock, Paper, Scissors</h2>

    <div class="board">
        <div id="control-btn">
            <button>Rock</button>
            <button>Paper</button>
            <button>Scissors</button>
        </div>

        <div class="results">
            <!--Result of the logic-->
        </div>
    </div>
    
    <div class="choice-scores">
        <h4 id="user-choice">User Choice: </h4>
        <h4 id="userScore">User Score: </h4>

        <h4 id="computer-choice">Computer Choice: </h4>
        <h4 id="computerScore">Computer Score: </h4>
    </div>
    
    <div id="game-info">
        <div id="round">Round: 1 of 5</div>
        <!-- Existing score display elements -->
    </div>
    
    <div class="final-winner">
        <!--final winner baased on the scores-->
    </div>

    <button id="resetGame">Reset</button>
     <script src="./RockPaperScissors.js"></script>
</body>
</html>
